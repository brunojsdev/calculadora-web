<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="./img/fi-calc.png">
    
    <title>Calculadora | Bruno Silveira</title>
    <style>
        /* Paleta de Cores: Verde Neon, Azul Escuro, Ciano */
        :root {
            --cor-bg-main: #050a14;
            --cor-bg-card: #0b1221;
            --cor-primaria: #00ff88; /* Verde Neon */
            --cor-texto: #e2e8f0;
            --cor-borda: #1e293b;
        }

        * {
            box-sizing: border-box; /* Garante que padding não aumente o tamanho dos elementos */
        }

        body {
            background-color: var(--cor-bg-main);
            color: var(--cor-texto);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: var(--cor-primaria);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        .calculator {
            background-color: var(--cor-bg-card);
            border: 1px solid var(--cor-borda);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            width: 320px;
            margin: 0 auto;
        }

        /* CORREÇÃO DO VISOR: Agora contido dentro da calculadora */
        .calc-display {
            width: 100%; /* Ocupa 100% da largura interna disponível */
            height: 70px;
            background: #02040a;
            color: var(--cor-primaria);
            text-align: right;
            padding: 10px 15px;
            font-family: 'Courier New', monospace;
            font-size: 2rem;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #334155;
            
            display: flex;
            align-items: center;
            justify-content: flex-end;
            
            overflow-x: auto;
            white-space: nowrap;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        /* Estilização da barra de rolagem do display */
        .calc-display::-webkit-scrollbar {
            height: 4px;
        }
        .calc-display::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }

        .calc-keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            border: 1px solid var(--cor-borda);
            background: #1e293b;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        button:hover {
            border-color: var(--cor-primaria);
            color: var(--cor-primaria);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.op {
            background: rgba(0, 255, 136, 0.1);
            color: var(--cor-primaria);
            border-color: rgba(0, 255, 136, 0.2);
        }
        
        button.op:hover {
            background: var(--cor-primaria);
            color: black;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        button.clear {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }
        button.clear:hover {
            background: #ef4444;
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        /* Estilo do Botão Voltar */
        .btn-voltar {
            margin-top: 30px;
            padding: 10px 25px;
            background: transparent;
            border: 1px solid var(--cor-primaria);
            color: var(--cor-primaria);
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: all 0.3s;
            display: inline-block;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .btn-voltar:hover {
            background: var(--cor-primaria);
            color: #050a14;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Calculadora Web</h2>
        <div class="calculator">
            <div class="calc-display" id="calc-display">0</div>
            <div class="calc-keys">
                <button class="clear" onclick="calcClear()">C</button>
                <button class="op" onclick="calcAppend('/')">/</button>
                <button class="op" onclick="calcAppend('*')">x</button>
                <button class="op" onclick="calcAppend('-')">-</button>
                
                <button onclick="calcAppend('7')">7</button>
                <button onclick="calcAppend('8')">8</button>
                <button onclick="calcAppend('9')">9</button>
                <button class="op" onclick="calcAppend('+')">+</button>
                
                <button onclick="calcAppend('4')">4</button>
                <button onclick="calcAppend('5')">5</button>
                <button onclick="calcAppend('6')">6</button>
                <button class="op" onclick="calcEqual()">=</button>
                
                <button onclick="calcAppend('1')">1</button>
                <button onclick="calcAppend('2')">2</button>
                <button onclick="calcAppend('3')">3</button>
                <button onclick="calcAppend('0')">0</button>
            </div>
        </div>
        
        <!-- Botão Voltar -->
        <a href="https://brunojsdev.github.io/meu-portfolio/#" class="btn-voltar">← Voltar ao Início</a>
    </div>

    <script>
        let calcExpression = "";
        const calcDisplay = document.getElementById("calc-display");

        function calcAppend(val) {
            const operators = ['+', '-', '*', '/'];
            const lastChar = calcExpression.slice(-1);

            if (operators.includes(val) && operators.includes(lastChar)) {
                return;
            }

            calcExpression += val;
            calcDisplay.innerText = calcExpression;
            scrollDisplayToEnd();
        }

        function calcClear() {
            calcExpression = "";
            calcDisplay.innerText = "0";
        }

        function calcEqual() {
            try {
                if (!calcExpression) return;
                
                if (/^[0-9+\-*/. ]+$/.test(calcExpression)) {
                    const result = eval(calcExpression); 
                    const formattedResult = Number.isInteger(result) ? result : result.toFixed(4);
                    
                    calcDisplay.innerText = formattedResult;
                    calcExpression = result.toString();
                } else {
                    throw new Error("Inválido");
                }
            } catch (e) {
                calcDisplay.innerText = "Erro";
                setTimeout(() => { calcClear(); }, 1500);
            }
        }

        function scrollDisplayToEnd() {
            calcDisplay.scrollLeft = calcDisplay.scrollWidth;
        }
    </script>
</body>
</html>
