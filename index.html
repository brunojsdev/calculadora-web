<!doctype html>
<!--
  ==========================================================================
  ÍNDICE DO ARQUIVO (HTML)
  1. CONFIGURAÇÕES E METADADOS (<head>)
  2. CONTROLES DE INTERFACE (Tema)
  3. NAVEGAÇÃO EXTERNA (Botão Voltar)
  4. FUNDO INTERATIVO (Canvas)
  5. ESTRUTURA DA CALCULADORA (Display e Teclado)
  6. RODAPÉ E SCRIPTS
  ==========================================================================
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <!-- Fonte moderna -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="./img/fi-port.png" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Botão de Alternância de Tema -->
    <button
      id="theme-toggle-btn"
      class="theme-toggle-btn"
      title="Alternar Modo Claro/Escuro"
    >
      <i data-lucide="star" class="img-dark-mode"></i>
      <i data-lucide="star-off" class="img-light-mode"></i>
    </button>

    <!-- Botão Voltar ao Portfolio -->
    <a
      href="https://brunojsilveira.vercel.app/#projects"
      class="back-portfolio-btn"
    >
      <i
        data-lucide="arrow-big-left-dash"
        style="width: 24px; height: 24px"
      ></i>
      <span>Voltar ao Portfolio</span>
    </a>

    <!-- Canvas de Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Container Principal da Calculadora -->
    <main class="container">
      <!-- Tela -->
      <div class="display">
        <div class="previous-operand" id="previous-operand"></div>
        <div class="current-operand" id="current-operand">0</div>
      </div>

      <!-- Teclado -->
      <div class="keypad">
        <!-- Voltando ao normal: Textos em vez de ícones para melhor legibilidade -->
        <button data-action="clear">C</button>
        <button class="span-2" data-action="delete">DELETE</button>
        <button class="btn-operator" data-action="/">÷</button>

        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button class="btn-operator" data-action="*">×</button>

        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button class="btn-operator" data-action="-">−</button>

        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button class="btn-operator" data-action="+">+</button>

        <button data-number=".">.</button>
        <button data-number="0">0</button>
        <button class="btn-action span-2" data-action="=">=</button>
      </div>
    </main>

    <!-- Rodapé -->
    <footer>
      &copy; 2026 Bruno J. Silveira. Todos os direitos reservados.
    </footer>

    <script src="script.js"></script>
  </body>
</html>
