<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Tech</title>
    <!-- Fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Canvas de Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Container Principal da Calculadora -->
    <main class="container">
        
        <!-- Tela -->
        <div class="display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>

        <!-- Teclado -->
        <div class="keypad">
            <button class="span-2" data-action="clear">CLEAR</button>
            <button class="span-2" data-action="delete">DELETE</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="btn-operator" data-action="-">−</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="btn-operator" data-action="+">+</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="btn-operator" data-action="*">×</button>
            
            <button class="btn-equals" data-action="=">=</button>
            <button class="btn-action" data-number="0">0</button>
            <button data-number=".">.</button>
            <button class="btn-operator" data-action="/">÷</button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
